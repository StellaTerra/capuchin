# Both USB audio devices share a constrained full-speed hub path.
# Force the lower-bandwidth alternate setting so the kernel can schedule them.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Kanto_Audio_ORA_by_Kanto.*" }
      { node.name = "~alsa_output.usb-Fractal_Fractal_Scape_Dongle.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
