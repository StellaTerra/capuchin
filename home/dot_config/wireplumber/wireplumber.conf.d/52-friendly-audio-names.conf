monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).usb-Fractal_Fractal_Scape_Dongle_.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Fractal Scape"
        node.nick = "Fractal Scape"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_(output|input).usb-Creative_Technology_Ltd_Creative_Pebble_Pro_.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Creative Pebble Pro"
        node.nick = "Creative Pebble Pro"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Speakers"
        node.nick = "Laptop Speakers"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Microphone"
        node.nick = "Laptop Microphone"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic2__source"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Microphone Jack"
        node.nick = "Laptop Microphone Jack"
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.A8_F5_E1_94_1F_94"
      }
    ]
    actions = {
      update-props = {
        device.description = "Shokz OpenRun Pro 2"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_output.A8_F5_E1_94_1F_94.*"
      }
      {
        node.name = "bluez_input.A8:F5:E1:94:1F:94"
      }
    ]
    actions = {
      update-props = {
        node.description = "Shokz OpenRun Pro 2"
        node.nick = "Shokz OpenRun Pro 2"
      }
    }
  }
]
