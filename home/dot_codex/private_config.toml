service_tier = "default"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
[projects."/var/home/stella"]
trust_level = "trusted"

[projects."/var/home/stella/marmoset"]
trust_level = "trusted"

[projects."/var/home/stella/readaloud"]
trust_level = "trusted"

[projects."/var/home/stella/marmoset/biometrics-protocol"]
trust_level = "trusted"

[projects."/var/home/stella/capuchin"]
trust_level = "trusted"

[projects."/var/home/stella/daily-training"]
trust_level = "trusted"

[projects."/var/home/stella/codex-desktop-linux"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[features]
js_repl = false

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"
show-context-window-usage = true
